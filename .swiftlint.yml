disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil
  - explicit_init
  - redundant_nil_coalescing
  - closure_spacing
  - overridden_super_call

included:
  - App
  - Widget
  - Packages/BreatheCore/Sources

excluded:
  - Packages/BreatheCore/.build

line_length:
  warning: 140
  error: 200

identifier_name:
  min_length: 2
  excluded: [id, a, b, p, vs]

type_body_length:
  warning: 300
