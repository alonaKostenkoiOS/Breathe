name: Breathe
options:
  bundleIdPrefix: com.breathe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BreatheCore:
    path: Packages/BreatheCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES

targets:
  Breathe:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: BreatheCore
      - target: BreatheWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breathe.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App Group sharing (for a personalised stats widget) needs a paid
        # Apple Developer account. Left off so the app builds on a free
        # account / device. See README to enable it.
        # CODE_SIGN_ENTITLEMENTS: App/Resources/Breathe.entitlements

  BreatheWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: BreatheCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breathe.app.widget
        # CODE_SIGN_ENTITLEMENTS: Widget/BreatheWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Breathe
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BreatheUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Breathe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breathe.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Breathe:
    build:
      targets:
        Breathe: all
    test:
      targets:
        - BreatheUITests
